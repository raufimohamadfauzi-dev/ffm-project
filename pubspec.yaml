  drift: ^2.34.3
  sqlite3: ^3.5.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^17.5.0
  get_it: ^9.2.1
  speech_to_text: ^7.4.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.0
  intl: ^0.20.3
  path: ^1.9.1
